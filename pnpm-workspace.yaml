packages:
  - .

# Supply-chain guard: refuse any version published less than 7 days ago, so a
# compromised release has time to be spotted and pulled before it can land here.
# Value is in MINUTES (7 * 24 * 60).
minimumReleaseAge: 10080

allowBuilds:
  bufferutil: false
  esbuild: true
  sharp: true
  utf-8-validate: false
  workerd: true

onlyBuiltDependencies:
  - workerd
  - sharp
  - esbuild
